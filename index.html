<!DOCTYPE html>
<html lang="sv"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050805">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pixel-OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Pixel-OS</title>
<style>
:root{--bg:#050805;--fg:#3dff6a;--dim:#1d9a3a;--hi:#d8ffe0;--warn:#f8b800;--err:#ff5f56}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#term{flex:1;overflow-y:auto;padding:14px 14px 6px;-webkit-overflow-scrolling:touch}
#out div{white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ps{color:var(--hi)}
#in{flex:1;min-width:60px;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px;caret-color:var(--fg);padding:0}
.dim{color:var(--dim)}.hi{color:var(--hi)}.warn{color:var(--warn)}.err{color:var(--err)}
a{color:var(--hi)}
#keys{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;border-top:1px solid #12301a;scrollbar-width:none}
#keys::-webkit-scrollbar{display:none}
#keys button{flex:none;background:#0d1a0f;color:var(--fg);border:1px solid #1d4a27;border-radius:6px;font:inherit;font-size:14px;padding:8px 12px;min-height:40px}
#keys button:active{background:#1d4a27}
.cur{display:inline-block;width:.6em;background:var(--fg);animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
</style></head><body>
<div id="term">
  <div id="out" aria-live="polite"></div>
  <div class="row"><span class="ps">dennis@pixel:~$</span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Kommando"></div>
</div>
<div id="keys" aria-label="Snabbkommandon"></div>
<script src="app.js"></script>
</body></html>
